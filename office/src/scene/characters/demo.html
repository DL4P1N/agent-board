<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Voxel character gallery</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #12141a; color: #d8dce6; font: 12px/1.3 ui-monospace, Menlo, monospace; overflow: hidden; }
  #bar { position: fixed; left: 0; right: 0; top: 0; z-index: 5; display: flex; flex-wrap: wrap; gap: 6px 14px; padding: 6px 10px; background: rgba(18,20,26,.92); border-bottom: 1px solid #2a2f3c; align-items: center; }
  #bar label { display: inline-flex; gap: 5px; align-items: center; white-space: nowrap; }
  #bar select, #bar button, #bar input[type=color] { background: #1d2230; color: #d8dce6; border: 1px solid #3a4152; border-radius: 3px; font: inherit; padding: 2px 4px; }
  #bar input[type=range] { width: 90px; }
  #bar button { cursor: pointer; }
  #bar .sk { display: inline-block; width: 14px; height: 14px; border: 1px solid #555; border-radius: 2px; cursor: pointer; opacity: .35; }
  #bar .sk.on { opacity: 1; outline: 2px solid #fff; }
  #stage { position: fixed; inset: 0; }
  canvas { display: block; width: 100%; height: 100%; }
  #labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .lab { position: absolute; transform: translate(-50%, 0); padding: 1px 5px; background: rgba(0,0,0,.55); border-radius: 3px; font-size: 11px; white-space: nowrap; }
  #hint { position: fixed; left: 10px; bottom: 6px; opacity: .55; }
</style>
</head>
<body>
<div id="bar">
  <label>layout <select id="layout"><option>poses</option><option>tiers</option><option>roles</option><option>single</option></select></label>
  <label>pose <select id="pose"></select></label>
  <label>provider <select id="provider"><option>mix</option><option>claude</option><option>codex</option></select></label>
  <label>role <select id="role"><option>worker</option><option>orchestrator</option><option>integrator</option><option>mix</option></select></label>
  <label>tier <select id="tier"><option>mix</option><option>haiku</option><option>sonnet</option><option>opus</option><option>fable</option><option>mini</option><option>standard</option><option>max</option><option>???</option></select></label>
  <label>subagents <input id="subagents" type="range" min="0" max="8" step="1" value="2" /><span id="subagentsV">2</span></label>
  <label>context <input id="fill" type="range" min="0" max="1" step="0.01" value="0.5" /><span id="fillV">0.50</span></label>
  <label><input id="seated" type="checkbox" checked /> seated</label>
  <label>carrying <select id="carry"><option>none</option><option>tickets</option><option>pr</option><option>rejected</option><option>skills</option></select></label>
  <label>count <input id="count" type="range" min="1" max="8" step="1" value="3" /><span id="countV">3</span></label>
  <label>owner <input id="owner" type="color" value="#a78bfa" /> <label><input id="ownerOn" type="checkbox" checked /> on</label></label>
  <label>skills <span id="skills"></span></label>
  <label><input id="selected" type="checkbox" /> selected</label>
  <label>speed <input id="speed" type="range" min="0" max="4" step="0.05" value="1" /><span id="speedV">1.00</span></label>
  <label><input id="spin" type="checkbox" /> auto-spin</label>
  <label><input id="pix" type="checkbox" /> pixelate</label>
  <label>px <input id="pxsize" type="range" min="1" max="8" step="1" value="3" /><span id="pxsizeV">3</span></label>
  <label>zoom <input id="zoom" type="range" min="0.5" max="6" step="0.05" value="1" /></label>
  <button id="flash">flash compaction</button>
</div>
<div id="stage"></div>
<div id="labels"></div>
<div id="hint">drag = orbit, wheel = zoom</div>
<script type="module" src="./demo.ts"></script>
</body>
</html>
