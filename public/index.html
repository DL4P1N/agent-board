<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team Board</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='3' fill='%233d5afe'/><rect x='3' y='4' width='3' height='8' fill='white'/><rect x='7' y='4' width='3' height='5' fill='white'/><rect x='11' y='4' width='2' height='6' fill='white'/></svg>">
<style>
  :root {
    --bg: #f6f6f4; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6b66; --line: #e3e2dd;
    --accent: #3d5afe; --warn: #c2410c; --ok: #15803d; --chip: #efeee9; --mention: #fff4d6;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151514; --panel: #1e1e1c; --ink: #ecebe6; --muted: #9a9993; --line: #2f2f2c;
      --accent: #8c9eff; --warn: #fb923c; --ok: #4ade80; --chip: #2a2a27; --mention: #3a3220; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 2; }
  header h1 { font-size: 16px; margin: 0; }
  header .sp { flex: 1; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); display: inline-block; }
  .dot.live { background: var(--ok); }
  main { display: grid; grid-template-columns: 1fr 380px; gap: 16px; padding: 16px; }
  @media (max-width: 1000px) { main { grid-template-columns: 1fr; } }
  .board { display: grid; grid-template-columns: repeat(6, minmax(150px, 1fr)); gap: 10px; overflow-x: auto; align-items: start; }
  .col { background: var(--chip); border-radius: 10px; padding: 8px; min-height: 120px; }
  .col h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 2px 4px 8px; display: flex; justify-content: space-between; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px; margin-bottom: 8px; cursor: pointer; }
  .card:hover { border-color: var(--accent); }
  .card .t { font-weight: 600; }
  .card .m { color: var(--muted); font-size: 12px; margin-top: 4px; display: flex; flex-wrap: wrap; gap: 6px; }
  .card.stale { border-left: 3px solid var(--warn); }
  .p1 { color: var(--warn); font-weight: 700; }
  .side { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  section.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
  section.panel h3 { margin: 0 0 8px; font-size: 13px; }
  .feed { max-height: 52vh; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
  .ev { font-size: 13px; padding: 4px 6px; border-radius: 6px; overflow-wrap: anywhere; }
  .ev.mention { background: var(--mention); }
  .ev .who { font-weight: 600; }
  .ev .meta { color: var(--muted); font-size: 11px; }
  .ev.sys { color: var(--muted); }
  input, textarea, select, button { font: inherit; color: inherit; }
  input, textarea, select { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; width: 100%; }
  button { background: var(--accent); color: #fff; border: 0; border-radius: 6px; padding: 6px 12px; cursor: pointer; }
  button.ghost { background: transparent; color: var(--accent); border: 1px solid var(--line); }
  .row { display: flex; gap: 6px; margin-top: 6px; }
  .row > * { flex: 1; }
  .row > button, .row > select.narrow { flex: 0 0 auto; width: auto; }
  .q { border-bottom: 1px solid var(--line); padding: 6px 0; }
  .q:last-child { border: 0; }
  .muted { color: var(--muted); }
  .lock { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; padding: 3px 0; }
  code { font-size: 12px; background: var(--chip); padding: 1px 4px; border-radius: 4px; }
  dialog { border: 1px solid var(--line); border-radius: 10px; background: var(--panel); color: var(--ink); width: min(640px, 92vw); }
  dialog::backdrop { background: rgba(0,0,0,.4); }
  .gate { max-width: 360px; margin: 15vh auto; background: var(--panel); padding: 20px; border-radius: 10px; border: 1px solid var(--line); }
</style>
</head>
<body>
<div id="gate" class="gate" hidden>
  <h3 style="margin-top:0">Join the board</h3>
  <label>Board token<input id="g-token"></label>
  <label style="display:block;margin-top:8px">Your name<input id="g-name" placeholder="e.g. dana"></label>
  <div class="row"><button id="g-go">Enter</button></div>
</div>

<div id="app" hidden>
  <header>
    <h1>Team Board</h1><span class="dot" id="live" title="live updates"></span>
    <span class="sp"></span>
    <span class="muted">you: <b id="me"></b></span>
    <button class="ghost" id="new-task-btn">+ Task</button>
  </header>
  <main>
    <div class="board" id="board"></div>
    <div class="side">
      <section class="panel" id="q-panel"><h3>Questions for humans</h3><div id="questions"></div></section>
      <section class="panel">
        <h3>Feed</h3>
        <div class="feed" id="feed"></div>
        <div class="row">
          <select id="chan" class="narrow"><option>general</option><option>help</option><option>review</option><option>humans</option></select>
          <input id="msg" placeholder="Message (use @name to mention)">
          <button id="send">Send</button>
        </div>
      </section>
      <section class="panel"><h3>Locks</h3><div id="locks"></div></section>
    </div>
  </main>
</div>

<dialog id="task-dlg">
  <form method="dialog" id="task-form">
    <h3 id="td-title" style="margin-top:0">New task</h3>
    <input id="td-name" placeholder="Title" required>
    <textarea id="td-desc" rows="6" placeholder="Description / acceptance criteria" style="margin-top:6px"></textarea>
    <div class="row">
      <select id="td-prio"><option value="1">P1 high</option><option value="2" selected>P2 normal</option><option value="3">P3 low</option></select>
      <select id="td-status"></select>
      <input id="td-deps" placeholder="depends on (ids, comma sep)">
    </div>
    <div id="td-history" class="feed" style="max-height:30vh;margin-top:8px"></div>
    <div class="row" style="justify-content:flex-end">
      <button class="ghost" value="cancel" formnovalidate>Close</button>
      <button id="td-save" value="save">Save</button>
    </div>
  </form>
</dialog>

<script>
const STATUSES = ['open', 'claimed', 'in_progress', 'blocked', 'review', 'done'];
const $ = (id) => document.getElementById(id);
const store = { get: (k) => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };
const qs = new URLSearchParams(location.search);
let token = qs.get('token') || store.get('board-token') || '';
let me = store.get('board-name') || '';
let state = { tasks: [], locks: [], questions: [], events: [] };
let editing = null;

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ago = (ts) => { const s = Math.round((Date.now() - ts) / 1000); return s < 60 ? `${s}s` : s < 3600 ? `${Math.round(s / 60)}m` : `${Math.round(s / 3600)}h`; };

async function api(path, opts = {}) {
  const r = await fetch('/api' + path, { ...opts, headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token, 'X-Agent': me, ...(opts.headers || {}) } });
  const body = await r.json().catch(() => ({}));
  if (r.status === 401) { showGate(); throw new Error('unauthorized'); }
  if (!r.ok) { alertish(body.error || r.statusText); throw new Error(body.error); }
  return body;
}
function alertish(msg) { const d = document.createElement('div'); d.className = 'ev mention'; d.textContent = '⚠ ' + msg; $('feed').prepend(d); }

function showGate() { $('app').hidden = true; $('gate').hidden = false; $('g-token').value = token; $('g-name').value = me; }
$('g-go').onclick = () => {
  token = $('g-token').value.trim(); me = $('g-name').value.trim().replace(/[^\w.-]/g, '');
  if (!token || !me) return;
  store.set('board-token', token); store.set('board-name', me); start();
};

async function load() { state = await api('/state'); render(); }
let reloadTimer;
const scheduleReload = () => { clearTimeout(reloadTimer); reloadTimer = setTimeout(load, 200); };

function render() {
  $('me').textContent = me;
  // board
  $('board').innerHTML = STATUSES.map((s) => {
    const items = state.tasks.filter((t) => t.status === s);
    return `<div class="col"><h2><span>${s.replace('_', ' ')}</span><span>${items.length}</span></h2>${items.map(card).join('')}</div>`;
  }).join('');
  document.querySelectorAll('.card').forEach((el) => (el.onclick = () => openTask(Number(el.dataset.id))));
  // questions
  const open = state.questions.filter((q) => !q.answer);
  $('questions').innerHTML = open.length ? open.map((q) => `
    <div class="q"><div><b>${esc(q.asker)}</b>${q.task_id ? ` <span class="muted">#${q.task_id}</span>` : ''}: ${esc(q.question)}</div>
    <div class="row"><input data-q="${q.id}" placeholder="Answer…"><button data-qa="${q.id}">Answer</button></div></div>`).join('')
    : '<div class="muted">None waiting.</div>';
  document.querySelectorAll('[data-qa]').forEach((b) => (b.onclick = async () => {
    const id = b.dataset.qa; const inp = document.querySelector(`[data-q="${id}"]`);
    if (!inp.value.trim()) return;
    await api(`/questions/${id}/answer`, { method: 'POST', body: JSON.stringify({ answer: inp.value.trim() }) });
  }));
  // locks
  $('locks').innerHTML = state.locks.length ? state.locks.map((l) => `
    <div class="lock"><span><code>${esc(l.path)}</code> ${esc(l.owner)}${l.task_id ? ` #${l.task_id}` : ''} <span class="muted">${Math.round(l.expires_in_s / 60)}m</span></span>
    <button class="ghost" data-unlock="${esc(l.path)}">release</button></div>`).join('') : '<div class="muted">No locks.</div>';
  document.querySelectorAll('[data-unlock]').forEach((b) => (b.onclick = () => api('/locks/release', { method: 'POST', body: JSON.stringify({ paths: [b.dataset.unlock] }) })));
  // feed
  const feed = $('feed'); const atBottom = feed.scrollHeight - feed.scrollTop - feed.clientHeight < 40;
  feed.innerHTML = state.events.map(evHtml).join('');
  if (atBottom) feed.scrollTop = feed.scrollHeight;
}

function card(t) {
  return `<div class="card ${t.stale ? 'stale' : ''}" data-id="${t.id}">
    <div class="t">#${t.id} ${esc(t.title)}</div>
    <div class="m">${t.priority === 1 ? '<span class="p1">P1</span>' : ''}${t.assignee ? `<span>👤 ${esc(t.assignee)}</span>` : ''}
    ${t.depends_on.length ? `<span>⛓ ${t.depends_on.map((d) => '#' + d).join(' ')}</span>` : ''}<span>${ago(t.updated_at)}</span>${t.stale ? '<span style="color:var(--warn)">stale</span>' : ''}</div></div>`;
}
function evHtml(e) {
  const sys = e.kind !== 'message' && e.kind !== 'question' && e.kind !== 'answer';
  const mention = (e.data?.mentions || []).some((m) => m === me || m === 'all' || m === 'everyone');
  return `<div class="ev ${sys ? 'sys' : ''} ${mention ? 'mention' : ''}">
    <span class="meta">${new Date(e.ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })} · ${esc(e.channel)}${e.kind === 'question' ? ' · ❓' : ''}</span><br>
    <span class="who">${esc(e.author)}</span> ${esc(e.text)}</div>`;
}

function openTask(id) {
  editing = id ? state.tasks.find((t) => t.id === id) : null;
  $('td-title').textContent = editing ? `Task #${editing.id}` : 'New task';
  $('td-name').value = editing?.title || '';
  $('td-desc').value = editing?.description || '';
  $('td-prio').value = String(editing?.priority || 2);
  $('td-deps').value = (editing?.depends_on || []).join(', ');
  $('td-deps').disabled = !!editing;
  $('td-status').innerHTML = STATUSES.map((s) => `<option ${s === (editing?.status || 'open') ? 'selected' : ''}>${s}</option>`).join('');
  $('td-status').disabled = !editing;
  $('td-history').innerHTML = editing
    ? `<div class="muted">assignee: ${esc(editing.assignee || '—')} · branch: <code>${esc(editing.branch || '—')}</code></div>` + state.events.filter((e) => e.task_id === editing.id).map(evHtml).join('')
    : '';
  $('task-dlg').showModal();
}
$('new-task-btn').onclick = () => openTask(null);
$('task-form').addEventListener('submit', async (ev) => {
  if (ev.submitter?.value !== 'save') return;
  const body = { title: $('td-name').value.trim(), description: $('td-desc').value, priority: Number($('td-prio').value) };
  if (!body.title) return;
  if (editing) await api(`/tasks/${editing.id}`, { method: 'PATCH', body: JSON.stringify({ ...body, status: $('td-status').value }) });
  else await api('/tasks', { method: 'POST', body: JSON.stringify({ ...body, depends_on: $('td-deps').value.split(',').map((s) => Number(s.trim())).filter(Boolean) }) });
});

async function send() {
  const text = $('msg').value.trim(); if (!text) return;
  await api('/messages', { method: 'POST', body: JSON.stringify({ text, channel: $('chan').value }) });
  $('msg').value = '';
}
$('send').onclick = send;
$('msg').addEventListener('keydown', (e) => { if (e.key === 'Enter') send(); });

function connect() {
  const es = new EventSource('/api/stream?token=' + encodeURIComponent(token));
  es.onopen = () => $('live').classList.add('live');
  es.onmessage = scheduleReload;
  es.onerror = () => { $('live').classList.remove('live'); };
}

async function start() {
  if (!token || !me) return showGate();
  if (qs.get('token')) { store.set('board-token', token); history.replaceState(null, '', location.pathname); }
  $('gate').hidden = true; $('app').hidden = false;
  await load(); connect();
  setInterval(render, 30000); // refresh "ago" labels
}
start();
</script>
</body>
</html>
