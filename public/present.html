<!doctype html>
<!-- Presenter view: the 3D office over the live board. Built into public/present.html by `npm run build:present`
     (office/vite.present.config.ts); edit this file and office/src/live/, not the built copy. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark" id="m-scheme">
<meta name="theme-color" content="#f1f2f4" media="(prefers-color-scheme: light)" id="m-tc-light">
<meta name="theme-color" content="#060607" media="(prefers-color-scheme: dark)" id="m-tc-dark">
<title>Board presenter</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%23ffb86b'/><rect x='3' y='4' width='3' height='8' fill='%232a1600'/><rect x='7' y='4' width='3' height='5' fill='%232a1600'/><rect x='11' y='4' width='2' height='6' fill='%232a1600'/></svg>">
<meta name="description" content="Read-only big-screen view of the team board: the 3D office with the live goal, countdown and progress">
<script>
// Before anything loads: the board's theme choice (one of its fifteen themes, or Auto, per browser; Auto leaves
// html[data-theme] off and follows the OS: Dark or Light), and no WebGL means the
// simple 2D presenter instead (it reads the same viewer token; the address keeps it if it came with one).
(function () {
  // themes:start
  var THEMES = {
    dark: ["Dark", '#060607'],
    light: ["Light", '#f1f2f4', 1],
    dusk: ["Dusk", '#1b1530'],
    day: ["Day", '#efe4cf', 1],
    night: ["Night", '#080c1a'],
    terminal: ["Terminal", '#020a04'],
    contrast: ["High Contrast", '#000000'],
    paper: ["Paper", '#e9e4d8', 1],
    synthwave: ["Synthwave", '#130824'],
    ocean: ["Ocean", '#04161f'],
    sticky: ["Sticky Note", '#ffe066', 1],
    coral: ["Coral", '#ffd3c2', 1],
    candy: ["Candy", '#e4efff', 1],
    sunset: ["Sunset", '#1c0d14'],
    forest: ["Forest", '#0e1912']
  };
  // themes:end
  try {
    var t = localStorage.getItem('board-theme');
    if (Object.prototype.hasOwnProperty.call(THEMES, t)) {
      var light = !!THEMES[t][2], g = function (i) { return document.getElementById(i); };
      document.documentElement.setAttribute('data-theme', t);
      g('m-scheme').setAttribute('content', light ? 'light' : 'dark');
      g('m-tc-light').setAttribute('media', light ? 'all' : 'not all');
      g('m-tc-light').setAttribute('content', THEMES[light ? t : 'light'][1]);
      g('m-tc-dark').setAttribute('media', light ? 'not all' : 'all');
      g('m-tc-dark').setAttribute('content', THEMES[light ? 'dark' : t][1]);
    }
  } catch (e) {}
  var ok = false;
  try {
    var c = document.createElement('canvas');
    var gl = window.WebGLRenderingContext && (c.getContext('webgl2') || c.getContext('webgl'));
    ok = !!gl;
    var lose = gl && gl.getExtension('WEBGL_lose_context'); if (lose) lose.loseContext();
  } catch (e) {}
  if (!ok) { document.documentElement.setAttribute('data-scene', 'failed'); location.replace('present-classic.html' + location.search); }
})();
</script>
<style>
/* themes:start (generated by scripts/themes.mjs) */
html, body { margin: 0; background: #f1f2f4; }
@media (prefers-color-scheme: dark) { html:not([data-theme]), html:not([data-theme]) body { background: #060607; } }
html[data-theme="dark"], html[data-theme="dark"] body { background: #060607; }
html[data-theme="light"], html[data-theme="light"] body { background: #f1f2f4; }
html[data-theme="dusk"], html[data-theme="dusk"] body { background: #1b1530; }
html[data-theme="day"], html[data-theme="day"] body { background: #efe4cf; }
html[data-theme="night"], html[data-theme="night"] body { background: #080c1a; }
html[data-theme="terminal"], html[data-theme="terminal"] body { background: #020a04; }
html[data-theme="contrast"], html[data-theme="contrast"] body { background: #000000; }
html[data-theme="paper"], html[data-theme="paper"] body { background: #e9e4d8; }
html[data-theme="synthwave"], html[data-theme="synthwave"] body { background: #130824; }
html[data-theme="ocean"], html[data-theme="ocean"] body { background: #04161f; }
html[data-theme="sticky"], html[data-theme="sticky"] body { background: #ffe066; }
html[data-theme="coral"], html[data-theme="coral"] body { background: #ffd3c2; }
html[data-theme="candy"], html[data-theme="candy"] body { background: #e4efff; }
html[data-theme="sunset"], html[data-theme="sunset"] body { background: #1c0d14; }
html[data-theme="forest"], html[data-theme="forest"] body { background: #0e1912; }
/* themes:end */
</style>
  <script type="module" crossorigin src="./office/present-CS4NHtGN.js"></script>
  <link rel="modulepreload" crossorigin href="./office/themes-BWKGR2Q-.js">
  <link rel="stylesheet" crossorigin href="./office/present-BOa3iHWH.css">
</head>
<body>
<div id="live" class="has-msg">
  <header id="top"></header>
  <main id="scene" aria-label="The team's agents in a 3D office: one character per online agent"></main>
  <footer id="bottom"></footer>
  <div id="msg" role="status" aria-live="polite"><p>Loading the board…</p></div>
</div>
<noscript>The presenter view needs JavaScript. Open <a href="present-classic.html">the simple view</a>.</noscript>
</body>
</html>
