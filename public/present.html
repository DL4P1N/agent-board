<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Board presenter</title>
<link rel="icon" href="data:,">
<meta name="description" content="Read-only big-screen view of the team board for the room or the demo">
<style>
  :root {
    --bg: #f6f6f3; --panel: #ffffff; --ink: #1c1c1a; --muted: #5e5e58; --line: #dcdcd5;
    --accent: #4f5bd5; --ok: #1f7a43; --warn: #9a5b00; --bad: #b42318; --track: #e7e7e1; --dl: 42%;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141413; --panel: #1d1d1b; --ink: #f1f0ea; --muted: #a8a79f; --line: #34342f;
      --accent: #9aa3ff; --ok: #4fd18b; --warn: #f0b44c; --bad: #ff7a6b; --track: #2b2b27; --dl: 72%;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #141413; --panel: #1d1d1b; --ink: #f1f0ea; --muted: #a8a79f; --line: #34342f;
    --accent: #9aa3ff; --ok: #4fd18b; --warn: #f0b44c; --bad: #ff7a6b; --track: #2b2b27; --dl: 72%;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 18px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; min-height: 100vh; }
  main { max-width: 1600px; margin: 0 auto; padding: clamp(16px, 3vw, 40px); display: grid; gap: clamp(14px, 2vw, 28px); }
  header { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; color: var(--muted); font-size: 16px; }
  header .brand { font-weight: 700; color: var(--ink); }
  header .sp { flex: 1; }
  header a { color: var(--muted); font-size: 14px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); display: inline-block; }
  .dot.live { background: var(--ok); }
  .goal { font-size: clamp(26px, 3.6vw, 52px); font-weight: 700; line-height: 1.15; margin: 0; text-wrap: balance; }
  .row { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: clamp(14px, 2vw, 28px); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: clamp(16px, 2vw, 28px); min-width: 0; }
  .card h2 { margin: 0 0 10px; font-size: 15px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .clock { font-size: clamp(40px, 6vw, 96px); font-weight: 750; font-variant-numeric: tabular-nums; line-height: 1; }
  .clock.warn { color: var(--warn); } .clock.bad { color: var(--bad); }
  .sub { color: var(--muted); font-size: clamp(16px, 1.6vw, 24px); margin-top: 8px; }
  .prog { font-size: clamp(30px, 4vw, 64px); font-weight: 750; font-variant-numeric: tabular-nums; line-height: 1; }
  .bar { height: 18px; border-radius: 9px; background: var(--track); overflow: hidden; margin: 14px 0 12px; }
  .bar > span { display: block; height: 100%; background: var(--ok); border-radius: 9px; transition: width .6s ease; }
  @media (prefers-reduced-motion: reduce) { .bar > span { transition: none; } }
  .cols { display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: clamp(15px, 1.4vw, 20px); color: var(--muted); }
  .cols b { color: var(--ink); font-variant-numeric: tabular-nums; }
  ul.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  ul.list li { font-size: clamp(17px, 1.6vw, 24px); display: flex; gap: 10px; align-items: baseline; min-width: 0; }
  ul.list .who { font-weight: 700; color: hsl(var(--h) 60% var(--dl)); flex: 0 0 auto; }
  ul.list .what { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  ul.list .when { margin-left: auto; color: var(--muted); font-size: .8em; flex: 0 0 auto; }
  .empty { color: var(--muted); font-size: clamp(16px, 1.5vw, 22px); }
  .pills { display: flex; flex-wrap: wrap; gap: 10px; }
  .pill { border-radius: 999px; padding: 6px 14px; font-size: clamp(15px, 1.4vw, 20px); border: 1px solid var(--line); background: var(--panel); }
  .pill.ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, transparent); }
  .pill.bad { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, transparent); font-weight: 700; }
  .pill.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, transparent); }
  .msg { max-width: 640px; margin: 15vh auto; padding: 24px; font-size: 20px; }
  .msg code { font-size: 16px; }
</style>
</head>
<body>
<main id="app" aria-live="polite">
  <p class="msg">Loading the board…</p>
</main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const store = { get: (k) => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };
const qs = new URLSearchParams(location.search);
// A read-only viewer token (from the board's "Presenter view" link), kept apart from the main
// board's token so a projector laptop never holds the full board token.
const VIEW_KEY = 'board-view-token';
let token = qs.get('token') || store.get(VIEW_KEY) || '';
if (qs.get('token')) { store.set(VIEW_KEY, token); history.replaceState(null, '', location.pathname); }
const EXPIRED = "This presenter link has expired: open a new one from the board's header (<b>Presenter view</b>).";
let expired = false;
let state = null; let live = false; let lastErr = '';

// Person colours, the same as the main board.
const HUES = [215, 150, 275, 325, 185, 95, 250, 45, 300, 165];
const agentRoot = (a) => String(a || '').split('/')[0];
function personOf(name) {
  const root = agentRoot(name);
  const p = (state?.presence || []).find((x) => x.kind === 'agent' && x.name === root);
  if (p?.person) return p.person;
  return root.replace(/-(claude|codex|copilot|copilotcli|copilot-vscode|copilot-cli)\d*$/, '');
}
const hue = (name) => { let h = 0; for (const c of personOf(name)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return HUES[h % HUES.length]; };
const clock = (ts) => new Date(ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
function ago(ts) { const m = Math.round((Date.now() - ts) / 60000); return m < 1 ? 'just now' : m < 60 ? `${m}m ago` : `${Math.floor(m / 60)}h ${m % 60}m ago`; }
function dur(ms) { const t = Math.max(0, Math.round(ms / 1000)); const h = Math.floor(t / 3600); const m = Math.floor((t % 3600) / 60); const s = t % 60; return h ? `${h}h ${String(m).padStart(2, '0')}m` : `${m}:${String(s).padStart(2, '0')}`; }

async function load() {
  if (!token) return showMsg('Open this from the board: <b>Presenter view</b> in its header.');
  try {
    const r = await fetch('/api/state', { headers: { Authorization: 'Bearer ' + token } });
    if (r.status === 401 || r.status === 403) { expired = true; es?.close(); try { localStorage.removeItem(VIEW_KEY); } catch {} return showMsg(EXPIRED); }
    if (!r.ok) throw new Error(r.statusText);
    state = await r.json(); lastErr = '';
    render();
  } catch (e) { lastErr = 'Can\'t reach the board server; retrying…'; if (state) render(); else showMsg(esc(lastErr)); }
}
function showMsg(html) { $('app').innerHTML = `<p class="msg">${html}</p>`; }

function countdown() {
  const t = state?.time || {}; const now = Date.now();
  if (!t.deadline) return { big: '—', sub: 'No demo time set', cls: '' };
  if (t.past || now >= t.deadline) return { big: 'Demo time', sub: `Demo was at ${clock(t.deadline)}. Wrapping up.`, cls: 'warn' };
  if (t.freezeAt && now >= t.freezeAt) return { big: dur(t.deadline - now), sub: `Feature freeze · demo at ${clock(t.deadline)}`, cls: 'bad' };
  return { big: dur(t.deadline - now), sub: `until the demo (${clock(t.deadline)})${t.freezeAt && t.freezeAt < t.deadline ? ` · feature freeze at ${clock(t.freezeAt)}` : ''}`, cls: t.freezeAt && t.freezeAt - now < 30 * 60e3 ? 'warn' : '' };
}

function render() {
  if (!state || expired) return;
  const tasks = (state.tasks || []).filter((t) => t.status !== 'proposed');
  const by = (s) => tasks.filter((t) => (Array.isArray(s) ? s : [s]).includes(t.status)).length;
  const done = by('done'); const total = tasks.length; const pct = total ? Math.round((done / total) * 100) : 0;
  const cd = countdown();
  // Agents doing something, grouped by person.
  const working = (state.presence || []).filter((p) => p.kind === 'agent' && p.online && p.busy && !p.limited && p.doing);
  const groups = new Map();
  for (const a of working) { const k = a.person || personOf(a.name); if (!groups.has(k)) groups.set(k, []); groups.get(k).push(a); }
  const taskTitle = (id) => (state.tasks || []).find((t) => t.id === id)?.title || '';
  const merges = (state.events || []).filter((e) => e.kind === 'task_updated' && e.data?.status === 'done' && /→ done/.test(e.text || '')).slice(-6).reverse();
  const qOpen = (state.questions || []).filter((q) => !q.answer).length;
  const ci = state.main_ci;
  const ciPill = !ci ? '' : ci.status === 'fail' ? `<span class="pill bad">main is failing${ci.failing?.length ? `: ${esc(ci.failing.join(', '))}` : ''}</span>` : ci.status === 'pending' ? '<span class="pill">main: checks running…</span>' : '<span class="pill ok">✓ main green</span>';
  $('app').innerHTML = `
    <header><span class="dot ${live ? 'live' : ''}" aria-hidden="true"></span><span class="brand">Claude Board</span><span>${live ? 'Live' : lastErr ? esc(lastErr) : 'Connecting…'}</span></header>
    <h1 class="goal">${esc(state.settings?.goal || 'No goal set yet')}</h1>
    <div class="row">
      <section class="card" aria-labelledby="h-time"><h2 id="h-time">Time</h2><div class="clock ${cd.cls}" id="clock">${esc(cd.big)}</div><div class="sub" id="clock-sub">${esc(cd.sub)}</div></section>
      <section class="card" aria-labelledby="h-prog"><h2 id="h-prog">Progress</h2><div class="prog">${done} of ${total} done</div>
        <div class="bar" role="progressbar" aria-label="Tasks done" aria-valuemin="0" aria-valuemax="${total}" aria-valuenow="${done}"><span style="width:${pct}%"></span></div>
        <div class="cols"><span>Open <b>${by('open')}</b></span><span>In progress <b>${by(['claimed', 'in_progress'])}</b></span><span>Blocked <b>${by('blocked')}</b></span><span>Review <b>${by('review')}</b></span><span>Done <b>${done}</b></span></div></section>
    </div>
    <div class="row">
      <section class="card" aria-labelledby="h-now"><h2 id="h-now">Now working on</h2>
        ${groups.size ? `<ul class="list">${[...groups].map(([person, list]) => list.map((a) => `<li style="--h:${hue(a.name)}"><span class="who">${esc(person)}</span><span class="what" title="${esc(a.doing)}">${esc(a.doing)}</span></li>`).join('')).join('')}</ul>` : '<p class="empty">Nobody is working on anything right now.</p>'}</section>
      <section class="card" aria-labelledby="h-merged"><h2 id="h-merged">Just merged</h2>
        ${merges.length ? `<ul class="list">${merges.map((e) => `<li style="--h:${hue(e.author)}"><span class="who">#${esc(e.task_id)}</span><span class="what">${esc(taskTitle(e.task_id) || String(e.text || '').replace(/^#\d+\s*/, ''))}</span><span class="when">${esc(ago(e.ts))}</span></li>`).join('')}</ul>` : '<p class="empty">Nothing merged yet.</p>'}</section>
    </div>
    ${ciPill || qOpen ? `<div class="pills">${ciPill}${qOpen ? `<span class="pill warn">${qOpen} question${qOpen > 1 ? 's' : ''} waiting for a human</span>` : ''}</div>` : ''}`;
  document.title = total ? `${done}/${total} done · Board presenter` : 'Board presenter';
}
// Tick the countdown every second without re-rendering everything.
setInterval(() => { if (!state) return; const c = $('clock'); if (!c) return; const cd = countdown(); c.textContent = cd.big; c.className = 'clock ' + cd.cls; const s = $('clock-sub'); if (s) s.textContent = cd.sub; }, 1000);

let es; let reloadT;
function connect() {
  if (!token || expired || typeof EventSource === 'undefined') return;
  es?.close();
  es = new EventSource('/api/stream?token=' + encodeURIComponent(token));
  es.onopen = () => { live = true; render(); };
  es.onmessage = () => { clearTimeout(reloadT); reloadT = setTimeout(load, 300); };
  // A rotated or revoked token: the stream fails; check once whether the link has expired.
  es.onerror = () => { live = false; render(); clearTimeout(reloadT); reloadT = setTimeout(load, 1500); };
}
load().then(connect);
setInterval(load, 5000);
</script>
</body>
</html>
