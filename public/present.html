<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Board presenter</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='3' fill='%233d5afe'/><rect x='3' y='4' width='3' height='8' fill='white'/><rect x='7' y='4' width='3' height='5' fill='white'/><rect x='11' y='4' width='2' height='6' fill='white'/></svg>">
<meta name="description" content="Read-only big-screen view of the team board for the room or the demo">
<style>
  /* Presenter view: the board's design system (see public/index.html), set large for a screen across the room.
     Same colours, radius, status colours and motion; the type scale is fluid, from a phone to a projector. */
  :root {
    color-scheme: light;
    --bg: #f5f5f2; --panel: #ffffff; --chip: #eeede8; --ink: #1d1d1b; --muted: #66665f; --line: #e2e1db; --field-line: #8a897f;
    --accent: #3448d8; --accent-ink: #ffffff; --ok: #15803d; --warn: #b4410a; --warn-soft: #fff1e6; --bad: #b91c1c; --bad-soft: #fdecec;
    --pl: 28%; --ps: 60%;
    --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI Variable Display", "Segoe UI", Roboto, sans-serif;
    --fs-label: clamp(.8125rem, .95vw, 1.125rem); --fs-body: clamp(1rem, 1.5vw, 1.5rem); --fs-stat: clamp(1.5rem, 2.6vw, 2.75rem);
    --fs-goal: clamp(1.75rem, 3.6vw, 3.5rem); --fs-clock: clamp(2.75rem, 6.4vw, 6.5rem);
    --gap: clamp(12px, 1.6vw, 24px); --pad: clamp(16px, 2vw, 32px); --edge: clamp(16px, 3vw, 48px);
    --r-lg: 12px; --r-full: 999px; --e1: 0 1px 2px rgba(24, 24, 20, .06);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #141413; --panel: #1d1d1b; --chip: #262624; --ink: #ecebe6; --muted: #a09f98; --line: #31312d; --field-line: #75746c;
      --accent: #8f9dff; --accent-ink: #111111; --ok: #4ade80; --warn: #fb9a5b; --warn-soft: #33241a; --bad: #f87171; --bad-soft: #3a1d1d;
      --pl: 72%; --ps: 65%; --e1: none;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #141413; --panel: #1d1d1b; --chip: #262624; --ink: #ecebe6; --muted: #a09f98; --line: #31312d; --field-line: #75746c;
    --accent: #8f9dff; --accent-ink: #111111; --ok: #4ade80; --warn: #fb9a5b; --warn-soft: #33241a; --bad: #f87171; --bad-soft: #3a1d1d;
    --pl: 72%; --ps: 65%; --e1: none;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--ink); font: var(--fs-body)/1.4 var(--font); min-height: 100vh; -webkit-font-smoothing: antialiased; }
  h1, h2, p { margin: 0; }
  main { max-width: 1680px; margin: 0 auto; padding: var(--edge); display: grid; gap: var(--gap); }
  header { display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap; color: var(--muted); font-size: var(--fs-label); }
  header .brand { font-weight: 600; color: var(--ink); letter-spacing: -.01em; display: inline-flex; align-items: center; gap: 10px; }
  .mark { width: 1.4em; height: 1.4em; flex: 0 0 auto; }
  header .live { display: inline-flex; align-items: center; gap: 8px; }
  header .sp { flex: 1; }
  .dot { width: .6em; height: .6em; border-radius: var(--r-full); background: var(--field-line); display: inline-block; flex: 0 0 auto; }
  .dot.live { background: var(--ok); }
  /* The goal leads: the largest words on the screen after the countdown. */
  .goal { font-size: var(--fs-goal); font-weight: 600; line-height: 1.12; letter-spacing: -.022em; text-wrap: balance; max-width: 30ch; }
  .goal.unset { color: var(--muted); }
  .row { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: var(--gap); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-lg); padding: var(--pad); min-width: 0; box-shadow: var(--e1); }
  .card h2 { margin-bottom: .75em; font-size: var(--fs-label); line-height: 1.3; color: var(--muted); font-weight: 600; }
  .clock { font-size: var(--fs-clock); font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1; letter-spacing: -.03em; }
  .clock.warn { color: var(--warn); } .clock.bad { color: var(--bad); }
  .clock.none { font-size: var(--fs-stat); line-height: 1.1; letter-spacing: -.018em; color: var(--muted); }
  .sub { color: var(--muted); margin-top: .6em; }
  .prog { font-size: var(--fs-stat); font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.1; letter-spacing: -.018em; }
  /* One bar, one segment per status, in the board's status colours. */
  .bar { display: flex; height: clamp(12px, 1.2vw, 20px); border-radius: var(--r-full); background: var(--chip); overflow: hidden; margin: 1em 0 .8em; }
  .bar > span { display: block; height: 100%; flex: 0 0 auto; }
  .s-done { background: var(--ok); } .s-review { background: var(--warn); } .s-blocked { background: var(--bad); } .s-doing { background: var(--accent); }
  .s-open { background: transparent; box-shadow: inset 0 0 0 2px var(--field-line); }
  .cols { display: flex; flex-wrap: wrap; gap: .4em 1.2em; color: var(--muted); }
  .cols > span { display: inline-flex; align-items: center; gap: .45em; white-space: nowrap; }
  .cols i { width: .6em; height: .6em; border-radius: var(--r-full); flex: 0 0 auto; }
  .cols b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
  ul.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: .55em; }
  ul.list li { display: flex; gap: .6em; align-items: baseline; min-width: 0; }
  ul.list .who { font-weight: 600; color: hsl(var(--h) var(--ps) var(--pl)); flex: 0 0 auto; font-variant-numeric: tabular-nums; }
  ul.list .what { min-width: 0; overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; overflow-wrap: anywhere; }
  ul.list .when { margin-left: auto; color: var(--muted); font-size: .8em; flex: 0 0 auto; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .empty { color: var(--muted); }
  .pills { display: flex; flex-wrap: wrap; gap: 8px; }
  .pill { border-radius: var(--r-full); padding: .25em .9em; background: var(--chip); color: var(--muted); font-weight: 500; white-space: nowrap; }
  .pill.ok { color: var(--ok); background: color-mix(in srgb, var(--ok) 16%, transparent); }
  .pill.bad { color: var(--bad); background: var(--bad-soft); font-weight: 600; white-space: normal; }
  .pill.warn { color: var(--warn); background: var(--warn-soft); }
  .msg { max-width: 640px; margin: 15vh auto; padding: var(--pad); background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--e1); }
  .msg code { font-size: .85em; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<main id="app" aria-live="polite">
  <p class="msg">Loading the board…</p>
</main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
// Several boards can share a server: /b/<slug>/ has its own API under /b/<slug>/api. The default board is at the root.
const BASE = (location.pathname.match(/^\/b\/[^/]+/) || [''])[0];
const SLUG = BASE ? decodeURIComponent(BASE.slice(3)) : '';
const store = { get: (k) => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };
const qs = new URLSearchParams(location.search);
// A read-only viewer token (from the board's "Presenter view" link), kept apart from the main
// board's token so a projector laptop never holds the full board token.
const VIEW_KEY = 'board-view-token' + (BASE ? '@' + BASE : '');
let token = qs.get('token') || store.get(VIEW_KEY) || '';
if (qs.get('token')) { store.set(VIEW_KEY, token); history.replaceState(null, '', location.pathname); }
const EXPIRED = "This presenter link has expired: open a new one from the board's header (<b>Presenter view</b>).";
let expired = false; let unavailable = 0;
let state = null; let live = false; let lastErr = '';

// Person colours, the same as the main board.
const HUES = [215, 150, 275, 325, 185, 95, 250, 45, 300, 165];
const agentRoot = (a) => String(a || '').split('/')[0];
function personOf(name) {
  const root = agentRoot(name);
  const p = (state?.presence || []).find((x) => x.kind === 'agent' && x.name === root);
  if (p?.person) return p.person;
  return root.replace(/-(claude|codex|copilot|copilotcli|copilot-vscode|copilot-cli)\d*$/, '');
}
const nameHash = (n) => { let h = 0; for (const c of n) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h; };
// One colour per known person, like the board: a name whose colour is taken moves on to the next free one (a–z order).
let hueCache = null;
function personHues() {
  if (hueCache?.s === state) return hueCache.m;
  const known = new Set();
  for (const p of state?.presence || []) { const per = String(p.person || '').toLowerCase(); if (per) known.add(per); if (p.kind === 'human' && p.name) known.add(String(p.name).toLowerCase()); }
  const used = new Set(); const m = new Map();
  for (const n of [...known].sort()) { let i = nameHash(n) % HUES.length; for (let k = 0; k < HUES.length && used.has(i); k++) i = (i + 1) % HUES.length; used.add(i); m.set(n, HUES[i]); }
  hueCache = { s: state, m };
  return m;
}
const hue = (name) => { const r = String(personOf(name)).toLowerCase(); return personHues().get(r) ?? HUES[nameHash(r) % HUES.length]; };
const clock = (ts) => new Date(ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
function ago(ts) { const m = Math.round((Date.now() - ts) / 60000); return m < 1 ? 'just now' : m < 60 ? `${m}m ago` : `${Math.floor(m / 60)}h ${m % 60}m ago`; }
function dur(ms) { const t = Math.max(0, Math.round(ms / 1000)); const h = Math.floor(t / 3600); const m = Math.floor((t % 3600) / 60); const s = t % 60; return h ? `${h}h ${String(m).padStart(2, '0')}m` : `${m}:${String(s).padStart(2, '0')}`; }

async function load() {
  if (!token) return showMsg('Open this from the board: <b>Presenter view</b> in its header.');
  try {
    const r = await fetch(BASE + '/api/state', { cache: 'no-store', headers: { Authorization: 'Bearer ' + token } });
    if (r.status === 401 || r.status === 403) { expired = true; es?.close(); try { localStorage.removeItem(VIEW_KEY); } catch {} return showMsg(EXPIRED); }
    // Archived (410), moved to its own address (409) or failed to open (503): say so, keep checking
    // (the 5 s poll), and come back by itself when the board is available again.
    if (r.status === 410 || r.status === 409 || r.status === 503) {
      const body = await r.json().catch(() => ({}));
      unavailable = r.status; es?.close(); live = false;
      if (r.status === 410) return showMsg('This board is archived. The presenter view comes back by itself when the host restores it.');
      if (r.status === 503) return showMsg(`This board couldn't open: ${esc(body.error || 'unknown error')}. Checking again by itself.`);
      const to = String(body.moved_to || '').replace(/\/+$/, '');
      const url = new URL(to + '/present.html', location.origin); url.searchParams.set('token', token);
      return showMsg(`This board moved to its own address. <a href="${esc(url.href)}">Open the presenter view there</a>.`);
    }
    if (!r.ok) throw new Error(r.statusText);
    state = await r.json(); lastErr = '';
    if (unavailable) { unavailable = 0; $('app')._html = undefined; }
    render();
    if (!es || es.readyState === 2) connect(); // the stream closed for good (archived, restarted): open it again
  } catch (e) { lastErr = 'Can\'t reach the board server; retrying…'; if (state) render(); else showMsg(esc(lastErr)); }
}
function showMsg(html) { const a = $('app'); a._html = undefined; a.innerHTML = `<p class="msg">${html}</p>`; }

function countdown() {
  const t = state?.time || {}; const now = Date.now();
  if (!t.deadline) return { big: 'Not set', sub: 'Set the demo time on the board: Start here, step 2.', cls: 'none' };
  if (t.past || now >= t.deadline) return { big: 'Demo time', sub: `Demo was at ${clock(t.deadline)}. Wrapping up.`, cls: 'warn' };
  if (t.freezeAt && now >= t.freezeAt) return { big: dur(t.deadline - now), sub: `Feature freeze · demo at ${clock(t.deadline)}`, cls: 'bad' };
  return { big: dur(t.deadline - now), sub: `until the demo (${clock(t.deadline)})${t.freezeAt && t.freezeAt < t.deadline ? ` · feature freeze at ${clock(t.freezeAt)}` : ''}`, cls: t.freezeAt && t.freezeAt - now < 30 * 60e3 ? 'warn' : '' };
}

function render() {
  if (!state || expired || unavailable) return;
  const tasks = (state.tasks || []).filter((t) => t.status !== 'proposed');
  const by = (s) => tasks.filter((t) => (Array.isArray(s) ? s : [s]).includes(t.status)).length;
  const done = by('done'); const total = tasks.length; const pct = total ? Math.round((done / total) * 100) : 0;
  const cd = countdown();
  // Agents doing something, grouped by person.
  const working = (state.presence || []).filter((p) => p.kind === 'agent' && p.online && p.busy && !p.limited && p.doing);
  const groups = new Map();
  for (const a of working) { const k = a.person || personOf(a.name); if (!groups.has(k)) groups.set(k, []); groups.get(k).push(a); }
  const taskTitle = (id) => (state.tasks || []).find((t) => t.id === id)?.title || '';
  const merges = (state.events || []).filter((e) => e.kind === 'task_updated' && e.data?.status === 'done' && /→ done/.test(e.text || '')).slice(-6).reverse();
  const qOpen = (state.questions || []).filter((q) => !q.answer).length;
  const ci = state.main_ci;
  const ciPill = !ci ? '' : ci.status === 'fail' ? `<span class="pill bad">main is failing${ci.failing?.length ? `: ${esc(ci.failing.join(', '))}` : ''}</span>` : ci.status === 'pending' ? '<span class="pill">main: checks running…</span>' : '<span class="pill ok">✓ main green</span>';
  const n = { done, review: by('review'), blocked: by('blocked'), doing: by(['claimed', 'in_progress']), open: by('open') };
  const seg = (k) => (n[k] ? `<span class="s-${k}" data-seg="${k}" style="width:${(n[k] / total) * 100}%"></span>` : '');
  const key = (k, label) => `<span><i class="s-${k}" aria-hidden="true"></i>${label} <b>${n[k]}</b></span>`;
  const html = `
    <header><span class="brand"><svg class="mark" viewBox="0 0 16 16" aria-hidden="true"><rect width="16" height="16" rx="3.5" fill="var(--accent)"/><rect x="3" y="4" width="2.6" height="8" rx=".6" fill="var(--accent-ink)"/><rect x="6.7" y="4" width="2.6" height="5" rx=".6" fill="var(--accent-ink)"/><rect x="10.4" y="4" width="2.6" height="6.5" rx=".6" fill="var(--accent-ink)"/></svg>Claude Board</span><span class="live"><span class="dot ${live ? 'live' : ''}" aria-hidden="true"></span>${live ? 'Live' : lastErr ? esc(lastErr) : 'Connecting…'}</span><span class="sp"></span>
      ${ciPill || qOpen ? `<div class="pills">${ciPill}${qOpen ? `<span class="pill warn">${qOpen} question${qOpen > 1 ? 's' : ''} waiting for a human</span>` : ''}</div>` : ''}</header>
    <h1 class="goal${state.settings?.goal ? '' : ' unset'}">${esc(state.settings?.goal || 'No goal set yet')}</h1>
    <div class="row">
      <section class="card" aria-labelledby="h-time"><h2 id="h-time">Time</h2><div class="clock ${cd.cls}" id="clock">${esc(cd.big)}</div><div class="sub" id="clock-sub">${esc(cd.sub)}</div></section>
      <section class="card" aria-labelledby="h-prog"><h2 id="h-prog">Progress</h2><div class="prog">${done} of ${total} done</div>
        <div class="bar" role="progressbar" aria-label="Tasks done" aria-valuemin="0" aria-valuemax="${total}" aria-valuenow="${done}">${total ? ['done', 'review', 'blocked', 'doing'].map(seg).join('') : ''}</div>
        <div class="cols">${key('open', 'Open')}${key('doing', 'In progress')}${key('blocked', 'Blocked')}${key('review', 'Review')}${key('done', 'Done')}</div></section>
    </div>
    <div class="row">
      <section class="card" aria-labelledby="h-now"><h2 id="h-now">Now working on</h2>
        ${groups.size ? `<ul class="list">${[...groups].map(([person, list]) => list.map((a) => `<li style="--h:${hue(a.name)}"><span class="who">${esc(person)}</span><span class="what" title="${esc(a.doing)}">${esc(a.doing)}</span></li>`).join('')).join('')}</ul>` : '<p class="empty">Nobody is working on a task right now.</p>'}</section>
      <section class="card" aria-labelledby="h-merged"><h2 id="h-merged">Just merged</h2>
        ${merges.length ? `<ul class="list">${merges.map((e) => `<li style="--h:${hue(e.author)}"><span class="who">#${esc(e.task_id)}</span><span class="what">${esc(taskTitle(e.task_id) || String(e.text || '').replace(/^#\d+\s*/, ''))}</span><span class="when">${esc(ago(e.ts))}</span></li>`).join('')}</ul>` : '<p class="empty">Nothing merged yet. Finished tasks show up here.</p>'}</section>
    </div>`;
  // Live events arrive often: only touch the page when something on it changed, and let the bar grow from where it was.
  const app = $('app');
  if (app._html !== html) {
    const was = {}; app.querySelectorAll('[data-seg]').forEach((x) => { was[x.dataset.seg] = x.style.width; });
    app.innerHTML = html; app._html = html;
    if (!matchMedia('(prefers-reduced-motion: reduce)').matches && !document.hidden) app.querySelectorAll('[data-seg]').forEach((x) => {
      const from = was[x.dataset.seg] || '0%';
      if (from !== x.style.width && x.animate) x.animate([{ width: from }, { width: x.style.width }], { duration: 600, easing: 'cubic-bezier(.2, .7, .2, 1)' });
    });
  }
  const name = SLUG ? `${SLUG} · ` : '';
  document.title = total ? `${done}/${total} done · ${name}Board presenter` : `${name}Board presenter`;
}
// Tick the countdown every second without re-rendering everything.
setInterval(() => { if (!state) return; const c = $('clock'); if (!c) return; const cd = countdown(); c.textContent = cd.big; c.className = 'clock ' + cd.cls; const s = $('clock-sub'); if (s) s.textContent = cd.sub; }, 1000);

let es; let reloadT;
function connect() {
  if (!token || expired || unavailable || typeof EventSource === 'undefined') return;
  es?.close();
  es = new EventSource(BASE + '/api/stream?token=' + encodeURIComponent(token));
  es.onopen = () => { live = true; render(); };
  es.onmessage = () => { clearTimeout(reloadT); reloadT = setTimeout(load, 300); };
  // A rotated or revoked token: the stream fails; check once whether the link has expired.
  es.onerror = () => { live = false; render(); clearTimeout(reloadT); reloadT = setTimeout(load, 1500); };
}
load();
setInterval(load, 5000);
</script>
</body>
</html>
