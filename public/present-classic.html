<meta name="description" content="Read-only big-screen view of the team board for the room or the demo">
<script>
// The board's theme choice (Auto / Dusk / Day / Night / Terminal, per browser), like the board and the 3D presenter.
// Auto leaves html[data-theme] off and follows the OS. Older saved values: light = Day, dark = Dusk.
(function () {
  var THEMES = { dusk: '#1b1530', day: '#efe4cf', night: '#080c1a', terminal: '#020a04' };
  function themeOf(t) { t = t === 'light' ? 'day' : t === 'dark' ? 'dusk' : t; return Object.prototype.hasOwnProperty.call(THEMES, t) ? t : 'auto'; }
  function apply(t) {
    var d = document.documentElement, g = function (i) { return document.getElementById(i); };
    t = themeOf(t);
    var dark = t !== 'auto' && t !== 'day';
    if (t === 'auto') d.removeAttribute('data-theme'); else d.setAttribute('data-theme', t);
    g('m-scheme').setAttribute('content', t === 'auto' ? 'light dark' : dark ? 'dark' : 'light');
    g('m-tc-light').setAttribute('media', t === 'auto' ? '(prefers-color-scheme: light)' : t === 'day' ? 'all' : 'not all');
    g('m-tc-dark').setAttribute('media', t === 'auto' ? '(prefers-color-scheme: dark)' : dark ? 'all' : 'not all');
    g('m-tc-dark').setAttribute('content', dark ? THEMES[t] : THEMES.dusk);
  }
  try { apply(localStorage.getItem('board-theme')); } catch (e) {}
  // Changed on the board in another tab of this browser: follow it.
  addEventListener('storage', function (e) { if (e.key === 'board-theme') apply(e.newValue); });
})();
</script>
<style>

  .bar > span { display: block; height: 100%; flex: 0 0 auto; }

  .pill.ok { color: var(--ok); background: color-mix(in srgb, var(--ok) 16%, transparent); }

<body>
<main id="app" aria-live="polite">
  <p class="msg">Loading the board…</p>
</main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
// Several boards can share a server: /b/<slug>/ has its own API under /b/<slug>/api. The default board is at the root.
const BASE = (location.pathname.match(/^\/b\/[^/]+/) || [''])[0];
const SLUG = BASE ? decodeURIComponent(BASE.slice(3)) : '';
const store = { get: (k) => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };
const qs = new URLSearchParams(location.search);
// A read-only viewer token (from the board's "Presenter view" link), kept apart from the main
// board's token so a projector laptop never holds the full board token.
const VIEW_KEY = 'board-view-token' + (BASE ? '@' + BASE : '');
let token = qs.get('token') || store.get(VIEW_KEY) || '';
if (qs.get('token')) { store.set(VIEW_KEY, token); history.replaceState(null, '', location.pathname); }
const EXPIRED = "This presenter link has expired: open a new one from the board (<b>Presenter view</b> in its help, <b>?</b>, or Ctrl+K).";
let expired = false; let unavailable = 0;
let state = null; let live = false; let lastErr = '';

// Person colours, the same as the main board.
const HUES = [45, 75, 110, 145, 175, 200, 222, 245, 270, 295, 320];
const agentRoot = (a) => String(a || '').split('/')[0];
function personOf(name) {
  const root = agentRoot(name);
  const p = (state?.presence || []).find((x) => x.kind === 'agent' && x.name === root);
  if (p?.person) return p.person;
  return root.replace(/-(claude|codex|copilot|copilotcli|copilot-vscode|copilot-cli)\d*$/, '');
}
const nameHash = (n) => { let h = 0; for (const c of n) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h; };
// A person's colour comes from their name alone, like the board: it never changes when someone else joins.
const hue = (name) => HUES[nameHash(String(personOf(name)).toLowerCase()) % HUES.length];
const clock = (ts) => new Date(ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
function ago(ts) { const m = Math.round((Date.now() - ts) / 60000); return m < 1 ? 'just now' : m < 60 ? `${m}m ago` : `${Math.floor(m / 60)}h ${m % 60}m ago`; }
// The goal is often pasted from a doc: show it as plain words (no `code`, **bold**, [links](…) or # headings).
const plain = (s) => String(s || '').replace(/\[([^\]]*)\]\([^)]*\)/g, '$1').replace(/`+|\*\*|__/g, '').replace(/^\s*#+\s+/gm, '').replace(/\s+/g, ' ').trim();

function goalHead(s) {

  const m = line.length > 60 ? line.match(/^(.{20,}?[.!?])\s/) : null;
  return m ? m[1] : line;
}
// The deadline verdict, as on the board and the 3D presenter. Keep in sync with outlook() / teamSlots() in
// office/src/live/board.ts and outlook() in public/index.html. Slots: agents started, online and not out of usage.
const skipName = (n) => !n || n === 'board' || n === 'anonymous';
const limitedNow = (p, now) => !!p.limited && (!p.limited.until || p.limited.until > now);
function teamSlots(now) {
  const m = new Map(); const low = (n) => String(n || '').split('/')[0].toLowerCase();
  const get = (n) => { n = String(n).toLowerCase(); if (!m.has(n)) m.set(n, { slots: 0, extra: 0, base: 0, override: null, client: null, online: false, started: false, limited: null }); return m.get(n); };
  for (const p of state.presence || []) {
    if (p.kind !== 'agent' || skipName(p.name)) continue;
    const a = get(p.name); if (p.client) a.client = String(p.client);
    a.extra = Number(p.extra_slots) || 0;
    if (p.slots) a.slots = (Number(p.slots) || 0) - a.extra;
    if (p.base_slots) a.base = Number(p.base_slots) || 0;
    if (p.slots_override != null) a.override = Number(p.slots_override) || null;
    if (p.limited) a.limited = p.limited;
    a.online = a.online || !!p.online; a.started = a.started || !!p.started;
  }
  for (const e of state.events || []) {
    const n = low(e.author); if (skipName(n)) continue;
    if (['task_claimed', 'lock', 'question'].includes(e.kind) || String(e.author).includes('/')) { const a = get(n); a.started = true; if (now - e.ts < 10 * 60e3) a.online = true; }
  }
  for (const t of state.tasks || []) if (t.assignee && !skipName(low(t.assignee))) get(low(t.assignee)).started = true;
  for (const t of state.tasks || []) if (t.status === 'review' && t.reviewer && !skipName(low(t.reviewer))) get(low(t.reviewer)).started = true;
  let slots = 0;

    if (!a.base) a.base = a.client === 'Claude Code' ? 2 : 1;
    if (!a.slots) a.slots = a.override || a.base;
    const p = (state.presence || []).find((x) => x.kind === 'agent' && String(x.name).toLowerCase() === name);

const plural = (n, w, ws = w + 's') => `${n} ${n === 1 ? w : ws}`;
function durWords(ms) { const m = Math.max(1, Math.ceil(ms / 60e3)); const h = Math.floor(m / 60); return h >= 24 ? `${Math.floor(h / 24)}d ${h % 24}h` : h ? `${h}h ${m % 60}m` : `${m}m`; }

  const freezeAt = deadline - (Number(state.settings?.freeze_minutes) || 0) * 60e3; const frozen = now >= freezeAt;
  const left = (state.tasks || []).filter((x) => ['open', 'claimed', 'in_progress', 'review', 'blocked'].includes(x.status));

  const slots = teamSlots(now); if (!slots) return null;

  const shortBy = ratio > 1 ? Math.max(1, Math.round(left.length * (1 - mins / eta))) : 0;
  const verdict = ratio <= 0.9 ? 'ok' : ratio <= 1.1 ? 'tight' : 'behind';
  return { verdict, label: verdict === 'ok' ? 'On track' : verdict === 'tight' ? 'Tight' : `Behind by ~${plural(shortBy, 'task')}`,
    why: `About ${durWords(eta * 60e3)} of work left (${plural(left.length, 'task')} at this board's median time per size, over ${plural(slots, 'agent slot')} online) and ${durWords(mins * 60e3)} to the ${frozen ? 'demo' : 'freeze'}` };
}
// One vocabulary and one counting rule for every view (the board, its 3D view, both presenters). Keep in sync with
// columnCounts() / needsOf() in office/src/live/board.ts and blockedSplit() / isStale() in public/index.html.
// Tasks per board column: proposals sit (and count) in Open, as on the board; "x of y done" leaves them out.
function columnCounts(tasks) { const n = { open: 0, claimed: 0, in_progress: 0, blocked: 0, review: 0, done: 0 }; for (const t of tasks) n[t.status === 'proposed' ? 'open' : t.status]++; return n; }
const isStale = (t, now) => ['claimed', 'in_progress'].includes(t.status) && (typeof t.stale === 'boolean' ? t.stale : now - t.updated_at > 15 * 60e3);

// once, as the question); stale tasks; agents out of usage.

  const questions = (state.questions || []).filter((q) => !q.answer);

}
function dur(ms) { const t = Math.max(0, Math.round(ms / 1000)); const h = Math.floor(t / 3600); const m = Math.floor((t % 3600) / 60); const s = t % 60; return h ? `${h}h ${String(m).padStart(2, '0')}m` : `${m}:${String(s).padStart(2, '0')}`; }

async function load() {
  if (!token) return showMsg('Open this from the board: <b>Presenter view</b> in its help (<b>?</b>) or Ctrl+K.');
  try {
    const r = await fetch(BASE + '/api/state', { cache: 'no-store', headers: { Authorization: 'Bearer ' + token } });
    if (r.status === 401 || r.status === 403) { expired = true; es?.close(); try { localStorage.removeItem(VIEW_KEY); } catch {} return showMsg(EXPIRED); }
    // Archived (410), moved to its own address (409) or failed to open (503): say so, keep checking
    // (the 5 s poll), and come back by itself when the board is available again.

      unavailable = r.status; es?.close(); live = false;
      if (r.status === 410) return showMsg('This board is archived. The presenter view comes back by itself when the host restores it.');
      if (r.status === 503) return showMsg(`This board couldn't open: ${esc(body.error || 'unknown error')}. Checking again by itself.`);
      const to = String(body.moved_to || '').replace(/\/+$/, '');
      const url = new URL(to + '/present-classic.html', location.origin); url.searchParams.set('token', token);
      return showMsg(`This board moved to its own address. <a href="${esc(url.href)}">Open the presenter view there</a>.`);
    }
    if (!r.ok) throw new Error(r.statusText);
    state = await r.json(); lastErr = '';
    if (unavailable) { unavailable = 0; $('app')._html = undefined; }
    render();
    if (!es || es.readyState === 2) connect(); // the stream closed for good (archived, restarted): open it again
  } catch (e) { lastErr = 'Can\'t reach the board server; retrying…'; if (state) render(); else showMsg(esc(lastErr)); }
}
function showMsg(html) { const a = $('app'); a._html = undefined; a.innerHTML = `<p class="msg">${html}</p>`; }

function countdown() {
  const t = state?.time || {}; const now = Date.now();
  if (!t.deadline) return { big: 'Not set', sub: 'Set the demo time on the board: Start here, step 2.', cls: 'none' };
  // An hour after the demo the event is over: say so, with the final numbers, instead of a red "Demo time".
  if (now - t.deadline >= 60 * 60e3) { const ts = (state.tasks || []).filter((x) => x.status !== 'proposed'); return { big: 'Event finished', sub: `Demo was at ${clock(t.deadline)}. Final: ${ts.filter((x) => x.status === 'done').length} of ${ts.length} tasks done.`, cls: 'none' }; }
  if (t.past || now >= t.deadline) return { big: 'Demo time', sub: `Demo was at ${clock(t.deadline)}. Wrapping up.`, cls: 'warn' };
  if (t.freezeAt && now >= t.freezeAt) return { big: dur(t.deadline - now), sub: `Feature freeze · demo at ${clock(t.deadline)}`, cls: 'bad' };
  return { big: dur(t.deadline - now), sub: `until the demo (${clock(t.deadline)})${t.freezeAt && t.freezeAt < t.deadline ? ` · feature freeze at ${clock(t.freezeAt)}` : ''}`, cls: t.freezeAt && t.freezeAt - now < 30 * 60e3 ? 'warn' : '' };
}

function render() {
  if (!state || expired || unavailable) return;
  const tasks = (state.tasks || []).filter((t) => t.status !== 'proposed');
  const by = (s) => tasks.filter((t) => (Array.isArray(s) ? s : [s]).includes(t.status)).length;
  const done = by('done'); const total = tasks.length;
  const cd = countdown();
  // Who is working on what, one row per person: every task their agents hold (online or not), then
  // what their other agents say they're doing (a review, planning). Never tool-call names.
  const agents = (state.presence || []).filter((p) => p.kind === 'agent');
  const agentOf = (n) => agents.find((a) => a.name === agentRoot(n));
  const groups = new Map(); // person -> { items: [], out: bool, h: hue }
  const add = (name, text, stuck = false) => { const k = personOf(name); if (!groups.has(k)) groups.set(k, { items: [], out: false, h: hue(name) }); const g = groups.get(k); if (text) g.items.push({ text, stuck }); if (limitedNow(agentOf(name) || {}, Date.now())) g.out = true; };
  const holders = new Set();
  for (const t of tasks) if (['claimed', 'in_progress', 'blocked'].includes(t.status) && t.assignee) { holders.add(agentRoot(t.assignee)); add(t.assignee, `#${t.id} ${t.title}`, t.status === 'blocked'); }
  for (const a of agents) if (a.online && a.doing && !limitedNow(a, Date.now()) && !holders.has(a.name) && !/^working \(last board call/.test(a.doing)) add(a.name, a.doing);
  const people = [...groups].filter(([, g]) => g.items.length).sort((a, b) => a[0].localeCompare(b[0]));
  // Everyone who holds work (a big screen has room for a team), stuck tasks first and marked.
  const NOW_MAX = 6;
  for (const [, g] of groups) g.items.sort((a, b) => b.stuck - a.stuck);
  const itemsText = (g) => g.items.map((i) => (i.stuck ? `Blocked: ${i.text}` : i.text)).join('; ');
  const itemsHtml = (g) => g.items.map((i) => (i.stuck ? `<b class="stuck">Blocked</b> ${esc(i.text)}` : esc(i.text))).join('; ');
  const ol = outlook();
  // Amber, not red, even when behind: the room (judges, other teams) sees it; it's a pace note for the team.
  const vd = ol ? `<span class="pill ${ol.verdict === 'ok' ? 'ok' : 'warn'}" id="verdict" title="${esc(ol.why)}.">${esc(ol.label)}</span>` : '';
  const nd = needsOf();
  const taskTitle = (id) => (state.tasks || []).find((t) => t.id === id)?.title || '';
  const merges = (state.events || []).filter((e) => e.kind === 'task_updated' && e.data?.status === 'done' && /→ done/.test(e.text || '')).slice(-4).reverse();
  const qOpen = nd.questions.length;
  const needPills = [qOpen ? `<span class="pill warn">${plural(qOpen, 'question')} waiting</span>` : '', nd.blocked.length ? `<span class="pill bad">${nd.blocked.length} blocked</span>` : '',
    nd.stale.length ? `<span class="pill">${nd.stale.length} stale</span>` : '', nd.limited.length ? `<span class="pill warn">${nd.limited.length} out of usage</span>` : ''].join('');
  const ci = state.main_ci;
  const ciPill = !ci ? '' : ci.status === 'fail' ? `<span class="pill bad">main is failing${ci.failing?.length ? `: ${esc(ci.failing.join(', '))}` : ''}</span>` : ci.status === 'pending' ? '<span class="pill">main: checks running…</span>' : '<span class="pill ok">✓ main green</span>';
  const c = columnCounts(state.tasks || []);
  const n = { done: c.done, review: c.review, blocked: c.blocked, doing: c.in_progress, claimed: c.claimed, open: c.open };
  const seg = (k) => (n[k] ? `<span class="s-${k}" data-seg="${k}" style="width:${(n[k] / total) * 100}%"></span>` : '');
  const key = (k, label) => `<span><i class="s-${k}" aria-hidden="true"></i>${label} <b>${n[k]}</b></span>`;
  const html = `
    <header><span class="brand"><svg class="mark" viewBox="0 0 16 16" aria-hidden="true"><rect width="16" height="16" fill="var(--mark)"/><rect x="3" y="4" width="2.6" height="8" fill="var(--mark-ink)"/><rect x="6.7" y="4" width="2.6" height="5" fill="var(--mark-ink)"/><rect x="10.4" y="4" width="2.6" height="6.5" fill="var(--mark-ink)"/></svg>Claude Board</span><span class="live"><span class="dot ${live ? 'live' : ''}" aria-hidden="true"></span>${live ? 'Live' : lastErr ? esc(lastErr) : 'Connecting…'}</span><span class="sp"></span>
      ${ciPill || needPills ? `<div class="pills">${ciPill}${needPills}</div>` : ''}</header>
    <h1 class="goal${state.settings?.goal ? '' : ' unset'}" title="${esc(plain(state.settings?.goal))}">${esc(goalHead(state.settings?.goal) || 'No goal set yet')}</h1>
    <div class="row">
      <section class="card" aria-labelledby="h-time"><h2 id="h-time">Time</h2>${vd}<div class="clock ${cd.cls}" id="clock">${esc(cd.big)}</div><div class="sub" id="clock-sub">${esc(cd.sub)}</div></section>
      <section class="card" aria-labelledby="h-prog"><h2 id="h-prog">Progress</h2><div class="prog">${done} of ${total} done</div>
        <div class="bar" role="progressbar" aria-label="Tasks done" aria-valuemin="0" aria-valuemax="${total}" aria-valuenow="${done}">${total ? ['done', 'review', 'blocked', 'doing', 'claimed'].map(seg).join('') : ''}</div>
        <div class="cols">${key('done', 'Done')}${key('open', 'Open')}${key('claimed', 'Claimed')}${key('doing', 'In progress')}${key('blocked', 'Blocked')}${key('review', 'Review')}</div></section>
    </div>
    <div class="row">
      <section class="card" aria-labelledby="h-now"><h2 id="h-now">Now working on</h2>
        ${people.length ? `<ul class="list">${people.slice(0, NOW_MAX).map(([person, g]) => `<li style="--h:${g.h}"><span class="who">${esc(person)}</span><span class="what" title="${esc(itemsText(g))}">${itemsHtml(g)}</span>${g.out ? '<span class="when tag">out of usage</span>' : ''}</li>`).join('')}</ul>${people.length > NOW_MAX ? `<p class="more">and ${people.length - NOW_MAX} more</p>` : ''}` : '<p class="empty">Nobody is working on a task right now.</p>'}</section>
      <section class="card" aria-labelledby="h-merged"><h2 id="h-merged">Just merged</h2>
        ${merges.length ? `<ul class="list">${merges.map((e) => `<li style="--h:${hue(e.author)}"><span class="who">#${esc(e.task_id)}</span><span class="what">${esc(taskTitle(e.task_id) || String(e.text || '').replace(/^#\d+\s*/, ''))}</span><span class="when">${esc(ago(e.ts))}</span></li>`).join('')}</ul>` : '<p class="empty">Nothing merged yet. Finished tasks show up here.</p>'}</section>
    </div>`;
  // Live events arrive often: only touch the page when something on it changed, and let the bar grow from where it was.
  const app = $('app');
  if (app._html !== html) {
    const was = {}; app.querySelectorAll('[data-seg]').forEach((x) => { was[x.dataset.seg] = x.style.width; });
    app.innerHTML = html; app._html = html;
    if (!matchMedia('(prefers-reduced-motion: reduce)').matches && !document.hidden) app.querySelectorAll('[data-seg]').forEach((x) => {
      const from = was[x.dataset.seg] || '0%';
      if (from !== x.style.width && x.animate) x.animate([{ width: from }, { width: x.style.width }], { duration: 600, easing: 'cubic-bezier(.2, .7, .2, 1)' });
    });
  }
  const name = SLUG ? `${SLUG} · ` : '';
  document.title = total ? `${done}/${total} done · ${name}Board presenter` : `${name}Board presenter`;
}
// Tick the countdown every second without re-rendering everything.
setInterval(() => { if (!state) return; const c = $('clock'); if (!c) return; const cd = countdown(); c.textContent = cd.big; c.className = 'clock ' + cd.cls; const s = $('clock-sub'); if (s) s.textContent = cd.sub; }, 1000);

let es; let reloadT;
function connect() {
  if (!token || expired || unavailable || typeof EventSource === 'undefined') return;
  es?.close();
  es = new EventSource(BASE + '/api/stream?token=' + encodeURIComponent(token));
  es.onopen = () => { live = true; render(); };
  es.onmessage = () => { clearTimeout(reloadT); reloadT = setTimeout(load, 300); };
  // A rotated or revoked token: the stream fails; check once whether the link has expired.
  es.onerror = () => { live = false; render(); clearTimeout(reloadT); reloadT = setTimeout(load, 1500); };
}
load();
setInterval(load, 5000);
</script>
</body>
</html>
