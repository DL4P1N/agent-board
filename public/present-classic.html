  var THEMES = {
    dark: ["Dark", '#060607'],
    light: ["Light", '#f1f2f4', 1],
    dusk: ["Dusk", '#1b1530'],

    candy: ["Cotton Candy", '#e4efff', 1],
    sunset: ["Sunset", '#1c0d14'],
    forest: ["Forest", '#0e1912']
  };
  // The favicon's colours per theme: accent, text, panel.
  var THEME_ICON = {
    dark: ['#7aa7ff', '#e6e7ea', '#0c0d0f'],
    light: ['#2b5bcc', '#1b1d21', '#ffffff'],
    dusk: ['#ff9466', '#f1e9ff', '#241c40'],
    day: ['#9a4a14', '#2c2114', '#fff7e8'],
    night: ['#ff9466', '#dce7ff', '#0f1730'],
    terminal: ['#4de0ff', '#a4ffb5', '#04140a'],
    contrast: ['#ff70ff', '#ffffff', '#0b0b0b'],
    paper: ['#1d4ea3', '#1d1b18', '#faf8f2'],
    synthwave: ['#ff4fa8', '#fbeeff', '#1e0e37'],
    ocean: ['#ff8a65', '#e2f4f8', '#0a2230'],
    sticky: ['#6b2bb5', '#2b1d05', '#fff7cc'],
    coral: ['#6a32c9', '#2e0f08', '#fff3ee'],
    candy: ['#c4127a', '#2a1640', '#fff4fa'],
    sunset: ['#ff80d0', '#ffeee8', '#28131d'],
    forest: ['#c9a7ff', '#e8f1e3', '#15251a']
  };
  window.themeIcon = function (t) {
    var I = THEME_ICON, c = function (id) { return '.ma{fill:' + I[id][0] + '}.mi{fill:' + I[id][1] + '}.me{fill:' + I[id][2] + '}'; };
    var h = function (k) { return "<rect x='12' width='2.6' height='6' rx='1.3' class='" + k + "'/><circle cx='13.3' cy='1.6' r='2.4' class='ma'/><rect y='7' width='26' height='21' rx='8' class='" + k + "'/><rect x='6' y='14' width='4' height='7' rx='2' class='me'/><rect x='16' y='14' width='4' height='7' rx='2' class='me'/>"; };
    var css = Object.prototype.hasOwnProperty.call(I, t) ? c(t) : c('light') + '@media (prefers-color-scheme:dark){' + c('dark') + '}';

  function themeOf(t) { return Object.prototype.hasOwnProperty.call(THEMES, t) ? t : 'auto'; }

    var d = document.documentElement, g = function (i) { return document.getElementById(i); };

    g('m-scheme').setAttribute('content', auto ? 'light dark' : light ? 'light' : 'dark');
    g('m-tc-light').setAttribute('media', auto ? '(prefers-color-scheme: light)' : light ? 'all' : 'not all');
    g('m-tc-light').setAttribute('content', THEMES[light ? t : 'light'][1]);
    g('m-tc-dark').setAttribute('media', auto ? '(prefers-color-scheme: dark)' : light ? 'not all' : 'all');

  }

<style>
  /* Classic presenter view (the simple 2D page): public/present.html (the 3D office) opens it when WebGL is missing,
     and links to it as "Simple view". The board's design system (see public/index.html), set large for a screen across the room.
     Same colours, radius, status colours and motion; the type scale is fluid, from a phone to a projector. */
  :root {
    /* The board's pixel look (office demo): square corners, 2px borders, bevelled panels, the board's themes (scripts/themes.mjs); monospace for labels and numbers. */
    --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI Variable Display", "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    /* Sizes follow the width and the height, so the page fits a 1366×768 projector as well as 1920×1080. */
    --fs-label: clamp(.8125rem, min(.95vw, 1.7vh), 1.125rem); --fs-body: clamp(1rem, min(1.5vw, 2.5vh), 1.5rem); --fs-stat: clamp(1.5rem, min(2.6vw, 4.2vh), 2.75rem);
    --fs-goal: clamp(1.5rem, min(3.6vw, 5.4vh), 3.5rem); --fs-clock: clamp(2.5rem, min(6.4vw, 10vh), 6.5rem);
    --gap: clamp(12px, min(1.6vw, 2.2vh), 24px); --pad: clamp(16px, min(2vw, 3vh), 32px); --edge: clamp(16px, min(3vw, 4vh), 48px);
    --r-lg: 0; --r-full: 0; --e1: 4px 4px 0 rgba(0, 0, 0, .16);

  const html = `
    <header><span class="brand"><svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><g transform="translate(-.5 3.5) scale(.53)"><rect x="12" y="0" width="2.6" height="6" rx="1.3" class="ma"/><circle cx="13.3" cy="1.6" r="2.4" class="ma"/><rect x="0" y="7" width="26" height="21" rx="8" class="ma"/><rect x="6" y="14" width="4" height="7" rx="2" class="me"/><rect x="16" y="14" width="4" height="7" rx="2" class="me"/></g><g transform="translate(18.7 3.5) scale(.53)"><rect x="12" y="0" width="2.6" height="6" rx="1.3" class="ma"/><circle cx="13.3" cy="1.6" r="2.4" class="ma"/><rect x="0" y="7" width="26" height="21" rx="8" class="ma"/><rect x="6" y="14" width="4" height="7" rx="2" class="me"/><rect x="16" y="14" width="4" height="7" rx="2" class="me"/></g><g transform="translate(6.1 6.8) scale(.76)"><rect x="12" y="0" width="2.6" height="6" rx="1.3" class="mi"/><circle cx="13.3" cy="1.6" r="2.4" class="ma"/><rect x="0" y="7" width="26" height="21" rx="8" class="mi"/><rect x="6" y="14" width="4" height="7" rx="2" class="me"/><rect x="16" y="14" width="4" height="7" rx="2" class="me"/></g></svg>Agent Board</span><span class="live"><span class="dot ${live ? 'live' : ''}" aria-hidden="true"></span>${live ? 'Live' : lastErr ? esc(lastErr) : 'Connecting…'}</span><span class="sp"></span>
      ${ciPill || needPills ? `<div class="pills">${ciPill}${needPills}</div>` : ''}</header>
    <h1 class="goal${state.settings?.goal ? '' : ' unset'}" title="${esc(plain(state.settings?.goal))}">${esc(goalHead(state.settings?.goal) || 'No goal set yet')}</h1>
    <div class="row">
      <section class="card" aria-labelledby="h-time"><h2 id="h-time">Time</h2>${vd}<div class="clock ${cd.cls}" id="clock">${esc(cd.big)}</div><div class="sub" id="clock-sub">${esc(cd.sub)}</div></section>
      <section class="card" aria-labelledby="h-prog"><h2 id="h-prog">Progress</h2><div class="prog">${done} of ${total} done</div>
        <div class="bar" role="progressbar" aria-label="Tasks done" aria-valuemin="0" aria-valuemax="${total}" aria-valuenow="${done}">${total ? ['done', 'review', 'blocked', 'doing'].map(seg).join('') : ''}</div>
        <div class="cols">${key('done', 'Done')}${key('open', 'Open')}${key('doing', 'In progress')}${key('blocked', 'Blocked')}${key('review', 'Review')}</div></section>
    </div>
    <div class="row">
      <section class="card" aria-labelledby="h-now"><h2 id="h-now">Now working on</h2>
        ${people.length ? `<ul class="list">${people.slice(0, NOW_MAX).map(([person, g]) => `<li style="--h:${g.h}"><span class="who">${esc(person)}</span><span class="what" title="${esc(itemsText(g))}">${itemsHtml(g)}</span>${g.out ? '<span class="when tag">out of usage</span>' : ''}</li>`).join('')}</ul>${people.length > NOW_MAX ? `<p class="more">and ${people.length - NOW_MAX} more</p>` : ''}` : '<p class="empty">Nobody is working on a task right now.</p>'}</section>
      <section class="card" aria-labelledby="h-merged"><h2 id="h-merged">Just merged</h2>
        ${merges.length ? `<ul class="list">${merges.map((e) => `<li style="--h:${hue(e.author)}"><span class="who">#${esc(e.task_id)}</span><span class="what">${esc(taskTitle(e.task_id) || String(e.text || '').replace(/^#\d+\s*/, ''))}</span><span class="when">${esc(ago(e.ts))}</span></li>`).join('')}</ul>` : '<p class="empty">Nothing merged yet. Finished tasks show up here.</p>'}</section>
    </div>`;
  // Live events arrive often: only touch the page when something on it changed, and let the bar grow from where it was.
  const app = $('app');
  if (app._html !== html) {
    const was = {}; app.querySelectorAll('[data-seg]').forEach((x) => { was[x.dataset.seg] = x.style.width; });
    app.innerHTML = html; app._html = html;
    if (!matchMedia('(prefers-reduced-motion: reduce)').matches && !document.hidden) app.querySelectorAll('[data-seg]').forEach((x) => {
      const from = was[x.dataset.seg] || '0%';
      if (from !== x.style.width && x.animate) x.animate([{ width: from }, { width: x.style.width }], { duration: 240, easing: 'cubic-bezier(.2, .7, .2, 1)' });
    });
  }
  const name = SLUG ? `${SLUG} · ` : '';
  document.title = total ? `${done}/${total} done · ${name}Board presenter` : `${name}Board presenter`;
}
// Tick the countdown every second without re-rendering everything.
setInterval(() => { if (!state) return; const c = $('clock'); if (!c) return; const cd = countdown(); c.textContent = cd.big; c.className = 'clock ' + cd.cls; const s = $('clock-sub'); if (s) s.textContent = cd.sub; }, 1000);

let es; let reloadT;
function connect() {
  if (!token || expired || unavailable || typeof EventSource === 'undefined') return;
  es?.close();
  es = new EventSource(BASE + '/api/stream?token=' + encodeURIComponent(token));
  es.onopen = () => { live = true; render(); };
  es.onmessage = () => { clearTimeout(reloadT); reloadT = setTimeout(load, 300); };
  // A rotated or revoked token: the stream fails; check once whether the link has expired.
  es.onerror = () => { live = false; render(); clearTimeout(reloadT); reloadT = setTimeout(load, 1500); };
}
load();
setInterval(load, 5000);
</script>
</body>
</html>
