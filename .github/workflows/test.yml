name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Agent-side smoke test + browser suites (the runner image ships Google Chrome). CI=true makes the 3D office
      # checks require WebGL (SwiftShader): without it they would be skipped silently.
      - run: npm test
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: tests/ui/shots/
          if-no-files-found: ignore

  office:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: office
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: office/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run test:sim
      # public/present.html and public/office/ are committed build output of office/: a source change without a rebuild
      # (or a stale hashed file left behind) fails here. Fix: run `npm run build:present` at the repo root and commit.
      - run: npm run build:present
      - name: Committed presenter build is up to date
        working-directory: .
        run: |
          if [ -n "$(git status --porcelain public/)" ]; then
            git status --short public/
            echo "::error::public/ is out of date with office/. Run 'npm run build:present' and commit the result."
            exit 1
          fi
