name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same pull request cancels the older run; runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      # The browser suites run on this exact Chrome (BROWSER_PATH below), not whatever the runner image ships.
      - id: chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        with:
          chrome-version: 158.0.8127.36
      - run: npm ci
      # Agent-side smoke test + browser suites. CI=true makes the 3D office checks require WebGL (SwiftShader):
      # without it they would be skipped silently.
      - run: npm test
        env:
          BROWSER_PATH: ${{ steps.chrome.outputs.chrome-path }}
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ui-screenshots
          path: tests/ui/shots/
          if-no-files-found: ignore

  # The oldest Node the package supports (engines: >=22.13) and Windows: the suites that need no browser.
  portable:
    name: no-browser suites (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: node 22.13 linux, os: ubuntu-latest, node: '22.13' }
          - { name: node 24 windows, os: windows-latest, node: '24' }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test -- --no-ui

  office:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: office
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: office/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run test:sim
      # public/present.html and public/office/ are committed build output of office/: a source change without a rebuild
      # (or a stale hashed file left behind) fails here. Fix: run `npm run build:present` at the repo root and commit.
      - run: npm run build:present
      - name: Committed presenter build is up to date
        working-directory: .
        run: |
          if [ -n "$(git status --porcelain public/)" ]; then
            git status --short public/
            echo "::error::public/ is out of date with office/. Run 'npm run build:present' and commit the result."
            exit 1
          fi
